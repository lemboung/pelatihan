<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e0d4"/>
      <stop offset="100%" stop-color="#d4c8b8"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#B0E0E6"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4fc3f7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" fill="url(#skyGrad)"/>

  <!-- Wall -->
  <rect x="0" y="120" width="1000" height="500" fill="url(#wallGrad)"/>
  <line x1="0" y1="120" x2="1000" y2="120" stroke="#b8a898" stroke-width="2"/>

  <!-- Title -->
  <text x="500" y="560" text-anchor="middle" fill="#333" font-size="24" font-weight="bold" font-family="sans-serif">Split AC System: Indoor + Outdoor Units</text>
  <text x="500" y="590" text-anchor="middle" fill="#666" font-size="16" font-family="sans-serif">Two units connected by refrigerant pipes</text>

  <!-- Indoor Unit (left side) -->
  <g transform="translate(60, 160)">
    <!-- Unit body -->
    <rect x="0" y="0" width="300" height="110" rx="10" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
    <!-- Vent -->
    <rect x="25" y="75" width="250" height="20" rx="4" fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
    <!-- Display -->
    <rect x="220" y="18" width="50" height="20" rx="3" fill="#1565c0"/>
    <text x="245" y="33" text-anchor="middle" fill="white" font-size="13" font-family="sans-serif">24°</text>
    <!-- Label -->
    <text x="20" y="42" fill="#666" font-size="16" font-weight="bold" font-family="sans-serif">INDOOR UNIT</text>
    <!-- Arrows showing airflow -->
    <path d="M 150 115 L 150 160" stroke="#4fc3f7" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
    <path d="M 90 115 L 90 150" stroke="#4fc3f7" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
    <path d="M 210 115 L 210 150" stroke="#4fc3f7" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
    <text x="150" y="175" text-anchor="middle" fill="#1565c0" font-size="13" font-family="sans-serif">Cold Air Out ↓</text>
  </g>

  <!-- Outdoor Unit (right side) -->
  <g transform="translate(620, 180)">
    <!-- Unit body -->
    <rect x="0" y="0" width="280" height="170" rx="8" fill="#e8e8e8" stroke="#bbb" stroke-width="2"/>
    <!-- Fan grill -->
    <circle cx="140" cy="75" r="60" fill="none" stroke="#999" stroke-width="3"/>
    <circle cx="140" cy="75" r="45" fill="none" stroke="#aaa" stroke-width="2"/>
    <circle cx="140" cy="75" r="30" fill="none" stroke="#bbb" stroke-width="1"/>
    <circle cx="140" cy="75" r="8" fill="#999"/>
    <!-- Fan blades -->
    <line x1="140" y1="75" x2="140" y2="25" stroke="#aaa" stroke-width="3"/>
    <line x1="140" y1="75" x2="185" y2="100" stroke="#aaa" stroke-width="3"/>
    <line x1="140" y1="75" x2="95" y2="100" stroke="#aaa" stroke-width="3"/>
    <!-- Label -->
    <text x="140" y="165" text-anchor="middle" fill="#666" font-size="16" font-weight="bold" font-family="sans-serif">OUTDOOR UNIT</text>
  </g>

  <!-- Pipe connection -->
  <g>
    <line x1="360" y1="230" x2="620" y2="250" stroke="#c62828" stroke-width="4" stroke-dasharray="10,5"/>
    <line x1="360" y1="260" x2="620" y2="280" stroke="#1565c0" stroke-width="4" stroke-dasharray="10,5"/>
    <text x="490" y="220" text-anchor="middle" fill="#c62828" font-size="15" font-weight="bold" font-family="sans-serif">Refrigerant Pipes</text>
    <text x="490" y="300" text-anchor="middle" fill="#888" font-size="13" font-family="sans-serif">(Hot Gas / Cold Liquid)</text>
  </g>
</svg>
