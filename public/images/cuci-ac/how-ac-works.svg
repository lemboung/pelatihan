<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620">
  <defs>
    <marker id="arrowGrey" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#bbb"/>
    </marker>
    <marker id="arrowBlue2" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4fc3f7"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#ff9800"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#1a1a2e" font-size="28" font-weight="bold" font-family="sans-serif">How a Split AC Works</text>

  <!-- Step 1: Warm air in -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="170" height="150" rx="12" fill="white" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="85" cy="60" r="35" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="85" y="68" text-anchor="middle" fill="#e65100" font-size="28">💨</text>
    <text x="85" y="120" text-anchor="middle" fill="#333" font-size="16" font-weight="bold" font-family="sans-serif">1. Warm Air In</text>
    <text x="85" y="140" text-anchor="middle" fill="#888" font-size="12" font-family="sans-serif">Room air enters</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 210 155 L 250 155" stroke="#bbb" stroke-width="3" fill="none" marker-end="url(#arrowGrey)"/>

  <!-- Step 2: Evaporator -->
  <g transform="translate(260, 80)">
    <rect x="0" y="0" width="170" height="150" rx="12" fill="white" stroke="#e0e0e0" stroke-width="1"/>
    <rect x="15" y="20" width="140" height="80" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
    <line x1="25" y1="40" x2="145" y2="40" stroke="#1565c0" stroke-width="3"/>
    <line x1="25" y1="55" x2="145" y2="55" stroke="#1565c0" stroke-width="3"/>
    <line x1="25" y1="70" x2="145" y2="70" stroke="#1565c0" stroke-width="3"/>
    <line x1="25" y1="85" x2="145" y2="85" stroke="#1565c0" stroke-width="3"/>
    <text x="85" y="125" text-anchor="middle" fill="#333" font-size="16" font-weight="bold" font-family="sans-serif">2. Evaporator</text>
    <text x="85" y="143" text-anchor="middle" fill="#888" font-size="12" font-family="sans-serif">Absorbs heat</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 440 155 L 480 155" stroke="#bbb" stroke-width="3" fill="none" marker-end="url(#arrowGrey)"/>

  <!-- Step 3: Compressor -->
  <g transform="translate(490, 80)">
    <rect x="0" y="0" width="170" height="150" rx="12" fill="white" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="85" cy="60" r="35" fill="#fce4ec" stroke="#e53935" stroke-width="2"/>
    <text x="85" y="68" text-anchor="middle" fill="#c62828" font-size="26" font-weight="bold" font-family="sans-serif">⚡</text>
    <text x="85" y="125" text-anchor="middle" fill="#333" font-size="16" font-weight="bold" font-family="sans-serif">3. Compressor</text>
    <text x="85" y="143" text-anchor="middle" fill="#888" font-size="12" font-family="sans-serif">Pressurizes gas</text>
  </g>

  <!-- Step 4: Condenser (bottom row) -->
  <g transform="translate(30, 300)">
    <rect x="0" y="0" width="170" height="150" rx="12" fill="white" stroke="#e0e0e0" stroke-width="1"/>
    <rect x="15" y="20" width="140" height="80" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
    <path d="M 35 35 Q 50 22 65 35 Q 80 48 95 35" stroke="#ff9800" stroke-width="3" fill="none"/>
    <path d="M 55 55 Q 70 42 85 55 Q 100 68 115 55" stroke="#ff9800" stroke-width="3" fill="none"/>
    <text x="85" y="125" text-anchor="middle" fill="#333" font-size="16" font-weight="bold" font-family="sans-serif">4. Condenser</text>
    <text x="85" y="143" text-anchor="middle" fill="#888" font-size="12" font-family="sans-serif">Releases heat outside</text>
  </g>

  <!-- Arrow 3 (down) -->
  <path d="M 575 240 L 575 290" stroke="#bbb" stroke-width="3" fill="none" marker-end="url(#arrowGrey)"/>

  <!-- Step 5: Expansion Valve -->
  <g transform="translate(260, 300)">
    <rect x="0" y="0" width="170" height="150" rx="12" fill="white" stroke="#e0e0e0" stroke-width="1"/>
    <polygon points="85,20 50,80 120,80" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
    <text x="85" y="68" text-anchor="middle" fill="#2e7d32" font-size="14" font-weight="bold" font-family="sans-serif">EXPAND</text>
    <text x="85" y="125" text-anchor="middle" fill="#333" font-size="16" font-weight="bold" font-family="sans-serif">5. Expansion</text>
    <text x="85" y="143" text-anchor="middle" fill="#888" font-size="12" font-family="sans-serif">Drops pressure</text>
  </g>

  <!-- Cycle arrows -->
  <path d="M 115 230 L 115 295" stroke="#4fc3f7" stroke-width="3" fill="none" marker-end="url(#arrowBlue2)"/>
  <path d="M 345 230 L 345 295" stroke="#ff9800" stroke-width="3" fill="none" marker-end="url(#arrowOrange)"/>

  <!-- Cold air output -->
  <g transform="translate(730, 300)">
    <rect x="0" y="0" width="200" height="120" rx="12" fill="#e3f2fd" stroke="#42a5f5" stroke-width="2"/>
    <text x="100" y="50" text-anchor="middle" fill="#1565c0" font-size="36">❄️</text>
    <text x="100" y="80" text-anchor="middle" fill="#1565c0" font-size="18" font-weight="bold" font-family="sans-serif">Cold Air</text>
    <text x="100" y="100" text-anchor="middle" fill="#1976d2" font-size="13" font-family="sans-serif">Back to room</text>
  </g>

  <!-- Summary -->
  <rect x="30" y="490" width="940" height="80" rx="10" fill="#1a1a2e"/>
  <text x="500" y="520" text-anchor="middle" fill="white" font-size="18" font-family="sans-serif">
    <tspan font-weight="bold">Key concept:</tspan> Refrigerant cycle carries heat from inside to outside
  </text>
  <text x="500" y="550" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="14" font-family="sans-serif">Dirty coils = reduced efficiency = higher energy bills</text>
</svg>
