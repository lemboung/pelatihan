<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">
  <rect width="1000" height="500" fill="#f8f9fa"/>

  <text x="500" y="42" text-anchor="middle" fill="#1a1a2e" font-size="28" font-weight="bold" font-family="sans-serif">Outdoor Unit Cleaning</text>

  <!-- Outdoor unit illustration -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="380" height="320" rx="10" fill="#e8e8e8" stroke="#bbb" stroke-width="2"/>

    <!-- Fan grill -->
    <circle cx="190" cy="140" r="100" fill="none" stroke="#999" stroke-width="3"/>
    <circle cx="190" cy="140" r="75" fill="none" stroke="#aaa" stroke-width="2"/>
    <circle cx="190" cy="140" r="50" fill="none" stroke="#bbb" stroke-width="1.5"/>
    <circle cx="190" cy="140" r="25" fill="none" stroke="#ccc" stroke-width="1"/>
    <circle cx="190" cy="140" r="10" fill="#999"/>

    <!-- Fan blades -->
    <line x1="190" y1="140" x2="190" y2="50" stroke="#aaa" stroke-width="4"/>
    <line x1="190" y1="140" x2="265" y2="180" stroke="#aaa" stroke-width="4"/>
    <line x1="190" y1="140" x2="115" y2="180" stroke="#aaa" stroke-width="4"/>

    <!-- Base -->
    <rect x="12" y="280" width="356" height="30" rx="4" fill="#d0d0d0"/>
  </g>

  <!-- Cleaning steps on the right -->
  <g transform="translate(500, 70)">
    <!-- Step 1 -->
    <g>
      <circle cx="25" cy="25" r="20" fill="#1565c0"/>
      <text x="25" y="32" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="sans-serif">1</text>
      <text x="58" y="32" fill="#333" font-size="17" font-weight="bold" font-family="sans-serif">Matikan &amp; cabut steker</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(0, 65)">
      <circle cx="25" cy="25" r="20" fill="#43a047"/>
      <text x="25" y="32" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="sans-serif">2</text>
      <text x="58" y="32" fill="#333" font-size="17" font-weight="bold" font-family="sans-serif">Buka casing atas</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(0, 130)">
      <circle cx="25" cy="25" r="20" fill="#ff9800"/>
      <text x="25" y="32" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="sans-serif">3</text>
      <text x="58" y="32" fill="#333" font-size="17" font-weight="bold" font-family="sans-serif">Bersihkan sirip kondensor</text>
      <text x="58" y="55" fill="#888" font-size="13" font-family="sans-serif">Gunakan air bertekanan rendah</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(0, 210)">
      <circle cx="25" cy="25" r="20" fill="#8e24aa"/>
      <text x="25" y="32" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="sans-serif">4</text>
      <text x="58" y="32" fill="#333" font-size="17" font-weight="bold" font-family="sans-serif">Bersihkan baling-baling</text>
    </g>

    <!-- Step 5 -->
    <g transform="translate(0, 275)">
      <circle cx="25" cy="25" r="20" fill="#c62828"/>
      <text x="25" y="32" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="sans-serif">5</text>
      <text x="58" y="32" fill="#333" font-size="17" font-weight="bold" font-family="sans-serif">Keringkan &amp; tes</text>
    </g>
  </g>

  <!-- Warning -->
  <g transform="translate(50, 420)">
    <rect x="0" y="0" width="900" height="65" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="30" y="42" fill="#e65100" font-size="28">⚠</text>
    <text x="70" y="28" fill="#e65100" font-size="17" font-weight="bold" font-family="sans-serif">PERINGATAN</text>
    <text x="70" y="52" fill="#bf360c" font-size="14" font-family="sans-serif">Jangan semprot langsung ke motor/kompressor. Hindari area kelistrikan. Gunakan tekanan air rendah.</text>
  </g>
</svg>
