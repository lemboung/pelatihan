<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620">
  <rect width="1000" height="620" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#1a1a2e" font-size="28" font-weight="bold" font-family="sans-serif">Before &amp; After: Cleaning the Evaporator</text>

  <!-- BEFORE -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="430" height="510" rx="12" fill="white" stroke="#ef5350" stroke-width="2"/>
    <rect x="0" y="0" width="430" height="55" rx="12" fill="#ef5350"/>
    <rect x="0" y="43" width="430" height="12" fill="#ef5350"/>
    <text x="215" y="38" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="sans-serif">BEFORE CLEANING</text>

    <!-- Dirty evaporator illustration -->
    <g transform="translate(30, 75)">
      <rect x="0" y="0" width="370" height="220" rx="8" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>

      <!-- Coil base -->
      <rect x="20" y="20" width="330" height="180" rx="5" fill="#e0e0e0"/>

      <!-- Dirty coil lines -->
      <g opacity="0.6">
        <line x1="30" y1="45" x2="340" y2="45" stroke="#5d4037" stroke-width="10" stroke-linecap="round"/>
        <line x1="30" y1="70" x2="340" y2="70" stroke="#6d4c41" stroke-width="10" stroke-linecap="round"/>
        <line x1="30" y1="95" x2="340" y2="95" stroke="#4e342e" stroke-width="10" stroke-linecap="round"/>
        <line x1="30" y1="120" x2="340" y2="120" stroke="#5d4037" stroke-width="10" stroke-linecap="round"/>
        <line x1="30" y1="145" x2="340" y2="145" stroke="#6d4c41" stroke-width="10" stroke-linecap="round"/>
        <line x1="30" y1="170" x2="340" y2="170" stroke="#4e342e" stroke-width="10" stroke-linecap="round"/>
      </g>

      <!-- Dirt blobs -->
      <circle cx="100" cy="60" r="18" fill="#795548" opacity="0.7"/>
      <circle cx="240" cy="85" r="22" fill="#6d4c41" opacity="0.6"/>
      <circle cx="160" cy="130" r="25" fill="#5d4037" opacity="0.5"/>
      <circle cx="280" cy="155" r="15" fill="#795548" opacity="0.7"/>
      <circle cx="80" cy="165" r="20" fill="#6d4c41" opacity="0.6"/>

      <!-- Dust particles -->
      <circle cx="60" cy="40" r="3" fill="#8d6e63"/>
      <circle cx="200" cy="50" r="4" fill="#8d6e63"/>
      <circle cx="300" cy="65" r="3" fill="#8d6e63"/>
      <circle cx="130" cy="105" r="4" fill="#8d6e63"/>
      <circle cx="260" cy="120" r="3" fill="#8d6e63"/>
    </g>

    <!-- Problem list -->
    <g transform="translate(30, 320)">
      <text x="0" y="0" fill="#c62828" font-size="18" font-weight="bold" font-family="sans-serif">Problems:</text>
      <text x="0" y="32" fill="#333" font-size="15" font-family="sans-serif">❌ Sirkulasi udara terhambat</text>
      <text x="0" y="58" fill="#333" font-size="15" font-family="sans-serif">❌ Efisiensi pendinginan turun</text>
      <text x="0" y="84" fill="#333" font-size="15" font-family="sans-serif">❌ Konsumsi energi meningkat</text>
      <text x="0" y="110" fill="#333" font-size="15" font-family="sans-serif">❌ Timbul bau tidak sedap</text>
    </g>
  </g>

  <!-- AFTER -->
  <g transform="translate(540, 70)">
    <rect x="0" y="0" width="430" height="510" rx="12" fill="white" stroke="#43a047" stroke-width="2"/>
    <rect x="0" y="0" width="430" height="55" rx="12" fill="#43a047"/>
    <rect x="0" y="43" width="430" height="12" fill="#43a047"/>
    <text x="215" y="38" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="sans-serif">AFTER CLEANING</text>

    <!-- Clean evaporator illustration -->
    <g transform="translate(30, 75)">
      <rect x="0" y="0" width="370" height="220" rx="8" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>

      <!-- Coil base -->
      <rect x="20" y="20" width="330" height="180" rx="5" fill="#e3f2fd"/>

      <!-- Clean coil lines -->
      <line x1="30" y1="40" x2="340" y2="40" stroke="#42a5f5" stroke-width="5" stroke-linecap="round"/>
      <line x1="30" y1="60" x2="340" y2="60" stroke="#42a5f5" stroke-width="5" stroke-linecap="round"/>
      <line x1="30" y1="80" x2="340" y2="80" stroke="#42a5f5" stroke-width="5" stroke-linecap="round"/>
      <line x1="30" y1="100" x2="340" y2="100" stroke="#42a5f5" stroke-width="5" stroke-linecap="round"/>
      <line x1="30" y1="120" x2="340" y2="120" stroke="#42a5f5" stroke-width="5" stroke-linecap="round"/>
      <line x1="30" y1="140" x2="340" y2="140" stroke="#42a5f5" stroke-width="5" stroke-linecap="round"/>
      <line x1="30" y1="160" x2="340" y2="160" stroke="#42a5f5" stroke-width="5" stroke-linecap="round"/>
      <line x1="30" y1="180" x2="340" y2="180" stroke="#42a5f5" stroke-width="5" stroke-linecap="round"/>

      <!-- Sparkle effects -->
      <g fill="#ffd54f">
        <polygon points="80,32 84,42 94,42 86,48 89,58 80,52 71,58 74,48 66,42 76,42"/>
        <polygon points="270,55 273,62 280,62 275,66 276,73 270,69 264,73 265,66 260,62 267,62"/>
        <polygon points="180,110 183,117 190,117 185,121 186,128 180,124 174,128 175,121 170,117 177,117"/>
      </g>

      <!-- Water droplets -->
      <ellipse cx="100" cy="200" rx="5" ry="8" fill="#81d4fa"/>
      <ellipse cx="180" cy="204" rx="4" ry="7" fill="#81d4fa"/>
      <ellipse cx="270" cy="202" rx="5" ry="8" fill="#81d4fa"/>
    </g>

    <!-- Benefits list -->
    <g transform="translate(30, 320)">
      <text x="0" y="0" fill="#2e7d32" font-size="18" font-weight="bold" font-family="sans-serif">Benefits:</text>
      <text x="0" y="32" fill="#333" font-size="15" font-family="sans-serif">✅ Sirkulasi udara lancar</text>
      <text x="0" y="58" fill="#333" font-size="15" font-family="sans-serif">✅ Pendinginan maksimal</text>
      <text x="0" y="84" fill="#333" font-size="15" font-family="sans-serif">✅ Hemat energi hingga 15%</text>
      <text x="0" y="110" fill="#333" font-size="15" font-family="sans-serif">✅ Udara lebih bersih &amp; sehat</text>
    </g>
  </g>

  <!-- VS divider -->
  <g transform="translate(465, 280)">
    <circle cx="35" cy="35" r="35" fill="#1a1a2e"/>
    <text x="35" y="42" text-anchor="middle" fill="white" font-size="18" font-weight="bold" font-family="sans-serif">VS</text>
  </g>
</svg>
