<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620">
  <!-- Background -->
  <rect width="1000" height="620" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#1a1a2e" font-size="28" font-weight="bold" font-family="sans-serif">Main AC Components</text>

  <!-- Indoor Unit Components -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="450" height="510" rx="12" fill="white" stroke="#e0e0e0" stroke-width="1"/>
    <rect x="0" y="0" width="450" height="50" rx="12" fill="#1565c0"/>
    <rect x="0" y="38" width="450" height="12" fill="#1565c0"/>
    <text x="225" y="35" text-anchor="middle" fill="white" font-size="20" font-weight="bold" font-family="sans-serif">INDOOR UNIT</text>

    <!-- Filter -->
    <g transform="translate(25, 70)">
      <rect x="0" y="0" width="90" height="90" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
      <line x1="12" y1="20" x2="78" y2="20" stroke="#66bb6a" stroke-width="1.5"/>
      <line x1="12" y1="35" x2="78" y2="35" stroke="#66bb6a" stroke-width="1.5"/>
      <line x1="12" y1="50" x2="78" y2="50" stroke="#66bb6a" stroke-width="1.5"/>
      <line x1="12" y1="65" x2="78" y2="65" stroke="#66bb6a" stroke-width="1.5"/>
      <text x="45" y="115" text-anchor="middle" fill="#333" font-size="15" font-weight="bold" font-family="sans-serif">Filter</text>
      <text x="45" y="135" text-anchor="middle" fill="#888" font-size="12" font-family="sans-serif">Debu &amp; kotoran</text>
    </g>

    <!-- Evaporator -->
    <g transform="translate(135, 70)">
      <rect x="0" y="0" width="90" height="90" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
      <line x1="10" y1="15" x2="80" y2="15" stroke="#42a5f5" stroke-width="3"/>
      <line x1="10" y1="30" x2="80" y2="30" stroke="#42a5f5" stroke-width="3"/>
      <line x1="10" y1="45" x2="80" y2="45" stroke="#42a5f5" stroke-width="3"/>
      <line x1="10" y1="60" x2="80" y2="60" stroke="#42a5f5" stroke-width="3"/>
      <line x1="10" y1="75" x2="80" y2="75" stroke="#42a5f5" stroke-width="3"/>
      <text x="45" y="115" text-anchor="middle" fill="#333" font-size="15" font-weight="bold" font-family="sans-serif">Evaporator</text>
      <text x="45" y="135" text-anchor="middle" fill="#888" font-size="12" font-family="sans-serif">Serpentin pendingin</text>
    </g>

    <!-- Blower Fan -->
    <g transform="translate(245, 70)">
      <rect x="0" y="0" width="90" height="90" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
      <circle cx="45" cy="40" r="30" fill="none" stroke="#ffb74d" stroke-width="2"/>
      <circle cx="45" cy="40" r="20" fill="none" stroke="#ffa726" stroke-width="1.5"/>
      <circle cx="45" cy="40" r="5" fill="#ff9800"/>
      <line x1="45" y1="40" x2="45" y2="14" stroke="#ffa726" stroke-width="3"/>
      <line x1="45" y1="40" x2="68" y2="52" stroke="#ffa726" stroke-width="3"/>
      <line x1="45" y1="40" x2="22" y2="52" stroke="#ffa726" stroke-width="3"/>
      <text x="45" y="115" text-anchor="middle" fill="#333" font-size="15" font-weight="bold" font-family="sans-serif">Blower</text>
      <text x="45" y="135" text-anchor="middle" fill="#888" font-size="12" font-family="sans-serif">Kipas angin</text>
    </g>

    <!-- Drain Pan -->
    <g transform="translate(355, 70)">
      <rect x="0" y="0" width="75" height="90" rx="6" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
      <rect x="5" y="50" width="65" height="20" rx="4" fill="#b2ebf2" stroke="#00acc1" stroke-width="1"/>
      <path d="M 35 20 L 35 50" stroke="#4dd0e1" stroke-width="3" stroke-dasharray="4,3"/>
      <circle cx="35" cy="16" r="5" fill="#4dd0e1"/>
      <text x="37" y="115" text-anchor="middle" fill="#333" font-size="15" font-weight="bold" font-family="sans-serif">Drain</text>
      <text x="37" y="135" text-anchor="middle" fill="#888" font-size="12" font-family="sans-serif">Penampung air</text>
    </g>

    <!-- Control Board -->
    <g transform="translate(25, 220)">
      <rect x="0" y="0" width="190" height="70" rx="6" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2"/>
      <rect x="12" y="12" width="30" height="20" rx="3" fill="#ce93d8"/>
      <rect x="48" y="12" width="30" height="20" rx="3" fill="#ce93d8"/>
      <rect x="84" y="12" width="30" height="20" rx="3" fill="#ce93d8"/>
      <rect x="12" y="38" width="30" height="18" rx="3" fill="#ce93d8"/>
      <rect x="48" y="38" width="30" height="18" rx="3" fill="#ce93d8"/>
      <text x="140" y="50" fill="#7b1fa2" font-size="14" font-family="sans-serif">PCB</text>
      <text x="95" y="95" text-anchor="middle" fill="#333" font-size="15" font-weight="bold" font-family="sans-serif">Control Board</text>
    </g>

    <!-- Front Cover -->
    <g transform="translate(235, 220)">
      <rect x="0" y="0" width="190" height="70" rx="6" fill="#efebe9" stroke="#8d6e63" stroke-width="2"/>
      <rect x="12" y="8" width="166" height="48" rx="4" fill="#d7ccc8"/>
      <text x="95" y="95" text-anchor="middle" fill="#333" font-size="15" font-weight="bold" font-family="sans-serif">Front Cover</text>
    </g>

    <!-- Extra notes -->
    <text x="225" y="340" text-anchor="middle" fill="#666" font-size="14" font-family="sans-serif">Parts that need regular cleaning</text>
    <rect x="25" y="360" width="400" height="130" rx="8" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
    <text x="225" y="385" text-anchor="middle" fill="#333" font-size="14" font-weight="bold" font-family="sans-serif">Key parts cleaned during service:</text>
    <text x="45" y="415" fill="#43a047" font-size="13" font-family="sans-serif">✓ Filter — setiap 2 minggu</text>
    <text x="45" y="440" fill="#1e88e5" font-size="13" font-family="sans-serif">✓ Evaporator — setiap 3-6 bulan</text>
    <text x="45" y="465" fill="#ff9800" font-size="13" font-family="sans-serif">✓ Blower — setiap 3-6 bulan</text>
    <text x="45" y="490" fill="#00838f" font-size="13" font-family="sans-serif">✓ Drain pan — setiap service</text>
  </g>

  <!-- Outdoor Unit Components -->
  <g transform="translate(520, 70)">
    <rect x="0" y="0" width="450" height="510" rx="12" fill="white" stroke="#e0e0e0" stroke-width="1"/>
    <rect x="0" y="0" width="450" height="50" rx="12" fill="#e65100"/>
    <rect x="0" y="38" width="450" height="12" fill="#e65100"/>
    <text x="225" y="35" text-anchor="middle" fill="white" font-size="20" font-weight="bold" font-family="sans-serif">OUTDOOR UNIT</text>

    <!-- Condenser Coil -->
    <g transform="translate(25, 70)">
      <rect x="0" y="0" width="130" height="90" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
      <line x1="12" y1="15" x2="118" y2="15" stroke="#fbc02d" stroke-width="3"/>
      <line x1="12" y1="30" x2="118" y2="30" stroke="#fbc02d" stroke-width="3"/>
      <line x1="12" y1="45" x2="118" y2="45" stroke="#fbc02d" stroke-width="3"/>
      <line x1="12" y1="60" x2="118" y2="60" stroke="#fbc02d" stroke-width="3"/>
      <line x1="12" y1="75" x2="118" y2="75" stroke="#fbc02d" stroke-width="3"/>
      <text x="65" y="115" text-anchor="middle" fill="#333" font-size="15" font-weight="bold" font-family="sans-serif">Condenser Coil</text>
    </g>

    <!-- Compressor -->
    <g transform="translate(170, 70)">
      <rect x="0" y="0" width="110" height="90" rx="6" fill="#fce4ec" stroke="#e53935" stroke-width="2"/>
      <circle cx="55" cy="40" r="30" fill="#ffcdd2" stroke="#ef5350" stroke-width="2"/>
      <text x="55" y="47" text-anchor="middle" fill="#c62828" font-size="18" font-weight="bold" font-family="sans-serif">C</text>
      <text x="55" y="115" text-anchor="middle" fill="#333" font-size="15" font-weight="bold" font-family="sans-serif">Compressor</text>
    </g>

    <!-- Fan -->
    <g transform="translate(295, 70)">
      <rect x="0" y="0" width="130" height="90" rx="6" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="2"/>
      <circle cx="65" cy="40" r="30" fill="none" stroke="#7986cb" stroke-width="2"/>
      <circle cx="65" cy="40" r="7" fill="#5c6bc0"/>
      <line x1="65" y1="40" x2="65" y2="14" stroke="#7986cb" stroke-width="3"/>
      <line x1="65" y1="40" x2="88" y2="52" stroke="#7986cb" stroke-width="3"/>
      <line x1="65" y1="40" x2="42" y2="52" stroke="#7986cb" stroke-width="3"/>
      <text x="65" y="115" text-anchor="middle" fill="#333" font-size="15" font-weight="bold" font-family="sans-serif">Fan</text>
    </g>

    <!-- Control Box -->
    <g transform="translate(25, 195)">
      <rect x="0" y="0" width="190" height="70" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
      <rect x="12" y="12" width="40" height="42" rx="4" fill="#a5d6a7"/>
      <rect x="60" y="18" width="110" height="10" rx="3" fill="#81c784"/>
      <rect x="60" y="35" width="80" height="10" rx="3" fill="#81c784"/>
      <text x="95" y="95" text-anchor="middle" fill="#333" font-size="15" font-weight="bold" font-family="sans-serif">Control Box</text>
    </g>

    <!-- Electrical Panel -->
    <g transform="translate(235, 195)">
      <rect x="0" y="0" width="190" height="70" rx="6" fill="#fbe9e7" stroke="#e64a19" stroke-width="2"/>
      <rect x="12" y="12" width="35" height="42" rx="3" fill="#ffab91"/>
      <rect x="52" y="12" width="35" height="42" rx="3" fill="#ffab91"/>
      <rect x="95" y="18" width="80" height="10" rx="3" fill="#ff8a65"/>
      <rect x="95" y="35" width="55" height="10" rx="3" fill="#ff8a65"/>
      <text x="95" y="95" text-anchor="middle" fill="#333" font-size="15" font-weight="bold" font-family="sans-serif">Electrical</text>
    </g>

    <!-- Extra notes -->
    <text x="225" y="310" text-anchor="middle" fill="#666" font-size="14" font-family="sans-serif">Outdoor unit maintenance</text>
    <rect x="25" y="330" width="400" height="160" rx="8" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
    <text x="225" y="355" text-anchor="middle" fill="#333" font-size="14" font-weight="bold" font-family="sans-serif">Outdoor cleaning frequency:</text>
    <text x="45" y="385" fill="#e65100" font-size="13" font-family="sans-serif">✓ Condenser coil — setiap 3-6 bulan</text>
    <text x="45" y="410" fill="#5c6bc0" font-size="13" font-family="sans-serif">✓ Fan blades — setiap service</text>
    <text x="45" y="435" fill="#e53935" font-size="13" font-family="sans-serif">✓ Compressor area — periksa kebocoran</text>
    <text x="45" y="460" fill="#43a047" font-size="13" font-family="sans-serif">✓ Pastikan sirkulasi udara lancar</text>
    <text x="45" y="485" fill="#8e24aa" font-size="13" font-family="sans-serif">✓ Periksa kabel &amp; sambungan</text>
  </g>
</svg>
